[project]
name = "deep-research-agent"
version = "0.1.0"
description = "Agentic research system with schema-enforced verifiable citations"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Jakkapat Kingthong", email = "jakkapat.potae@gmail.com"}
]
license = {text = "MIT"}
dependencies = [
    # Core LLM / Agent
    "anthropic>=0.40.0",
    "google-genai>=0.3.0",
    "langgraph>=0.2.50",
    "langchain-core>=0.3.0",
    # Structured data
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # Web tools
    "httpx>=0.27.0",
    "trafilatura>=1.12.0",
    "tavily-python>=0.5.0",
    "duckduckgo-search==6.3.0",
    # Rerank / embeddings
    "sentence-transformers>=3.3.0",
    # API + MCP
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.0",
    "fastmcp>=0.2.0",
    # Observability
    "loguru>=0.7.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    # CLI
    "typer>=0.15.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]
eval = [
    "deepeval>=1.5.0",
    "pandas>=2.2.0",
]

[project.scripts]
research = "deep_research.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_research"]

[tool.ruff]
line-length = 100
target-version = "py312"